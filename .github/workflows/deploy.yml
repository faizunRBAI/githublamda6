name: Build and Deploy

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Lambda zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies into package directory
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --target ./package

      - name: Assemble zip artifact
        run: |
          # Copy app source into the package directory so everything is at zip root
          cp -r app ./package/app
          cp lambda_handler.py ./package/lambda_handler.py

          # Also copy optional public/ directory if present
          if [ -d public ]; then
            cp -r public ./package/public
          fi

          # Create the zip from inside the package directory so all paths are root-level
          cd package
          zip -r ../lambda.zip . -x "*.pyc" -x "*/__pycache__/*" -x "*.dist-info/*" -x "*.egg-info/*"
          cd ..

      - name: Verify handler is present in zip
        run: |
          unzip -l lambda.zip | grep lambda_handler.py
          unzip -l lambda.zip | grep "app/main.py"

      - name: Upload zip to S3
        run: |
          aws s3 cp lambda.zip s3://${{ secrets.TF_STATE_BUCKET }}/${{ secrets.PROJECT_NAME }}/lambda.zip

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: lambda.zip
          retention-days: 7

  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="tf_state_bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Retrieve Function URL
        id: get_url
        working-directory: terraform
        run: |
          FUNCTION_URL=$(terraform output -raw function_url)
          echo "function_url=${FUNCTION_URL}" >> "$GITHUB_OUTPUT"
          echo "Function URL: ${FUNCTION_URL}"

      - name: Smoke test — verify app responds with 2xx/3xx
        run: |-
          FUNCTION_URL="${{ steps.get_url.outputs.function_url }}"
          echo "Testing endpoint: ${FUNCTION_URL}"

          # Retry up to 5 times with 10-second backoff to allow cold-start
          for i in 1 2 3 4 5; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${FUNCTION_URL}health/")
            echo "Attempt ${i}: HTTP status ${HTTP_STATUS}"
            if [[ "$HTTP_STATUS" =~ ^[23] ]]; then
              echo "Smoke test PASSED (status ${HTTP_STATUS})"
              exit 0
            fi
            echo "Non-2xx/3xx response (${HTTP_STATUS}), retrying in 10s..."
            sleep 10
          done

          echo "Smoke test FAILED — app did not return 2xx/3xx after 5 attempts"
          exit 1
